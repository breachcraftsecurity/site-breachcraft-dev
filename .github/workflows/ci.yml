name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML well formed
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tidy
          fail=0
          # tidy exits 1 on warnings (it flags valid ARIA such as aria-current) and 2 on errors; fail on errors only.
          for f in $(find . -name '*.html' -not -path './.git/*'); do rc=0; tidy -q -e "$f" || rc=$?; [ $rc -lt 2 ] || fail=1; done
          exit $fail
      - name: Spec, CSP, links, contrast and byte ceiling
        run: python3 scripts/check_site.py
